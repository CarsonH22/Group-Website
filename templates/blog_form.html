{% extends "base.html" %}

{% block content %}
<h1>{{ action }} Blog Post</h1>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

    <label>Title:</label><br>
    <input type="text" name="title" required value="{{ post.title if post else '' }}"><br><br>

    <label>Body:</label><br>
    <textarea name="body" rows="10" cols="70" required>{{ post.body if post else '' }}</textarea><br><br>

    <label>YouTube Video URL (optional):</label><br>
    <input type="text" name="video_url" style="width:400px"
           placeholder="https://www.youtube.com/watch?v=XXXX"
           value="{{ post.video_url if post else '' }}"><br><br>

    <button type="submit">{{ action }}</button>
</form>

<br>
<a href="{{ url_for('blog_index') }}">Back to Blog</a>

{% endblock %}
