<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick a Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='carsonstyles.css') }}">
</head>
<body>

  <header>
    <h2>Select Your Game</h2>
  </header>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form action="" method="post" class="game-selection">
    <div class="game-options-container">
      {% for game in ["Valorant", "Rainbow Six Siege", "CS:GO"] %}
      <div class="game-option">
        <label>
          <input type="radio" name="game_choice" value="{{ game }}">
          <div class="game-card">
            <img src="{{ {
              'Valorant': 'https://www.talkesport.com/wp-content/uploads/valorant-stuck-on-loading-screen.webp',
              'Rainbow Six Siege': 'https://i.redd.it/s5df0ihs55981.jpg',
              'CS:GO': 'https://media.steampowered.com/apps/csgo/blog/images/fb_image.png?v=6'
            }[game] }}" alt="{{ game }}">
            <p>{{ game }}</p>
          </div>
        </label>
      </div>
      {% endfor %}
    </div>
    <button type="submit">Continue</button>
  </form>

</body>
</html>
